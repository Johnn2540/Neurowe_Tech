  <circle cx="256" cy="256" r="240" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <!-- "N" letterform — centred within circle -->
  <path d="M136 148 L136 364 L196 364 L196 248 L316 364 L376 364 L376 148 L316 148 L316 264 L196 148 Z" fill="#ffffff"/>
