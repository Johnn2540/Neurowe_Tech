<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2b4a"/>
      <stop offset="100%" stop-color="#2d4270"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e05c2a"/>
      <stop offset="100%" stop-color="#c44e21"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background — required for maskable (OS applies its own mask shape) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Visual circle frame centred within safe zone (safe zone = 80% = 102px inset each side) -->
  <circle cx="256" cy="256" r="196" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.10)" stroke-width="2"/>
  <!-- "N" letterform — within safe zone -->
  <path d="M148 162 L148 350 L204 350 L204 256 L308 350 L364 350 L364 162 L308 162 L308 254 L204 162 Z" fill="#ffffff"/>
  <!-- Orange accent dot -->
  <circle cx="326" cy="360" r="24" fill="url(#acc)"/>
</svg>
